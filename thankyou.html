<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <meta name="viewport"
        content="width=device-width, initial-scale=1" />

    <title>Thank You | Girigreen Driving School</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="css/style.css" />

    <link rel="icon" href="assets/logo.JPG" />

    <!-- Auto Redirect -->
    <meta http-equiv="refresh" content="6; url=index.html" />

    <style>
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 1s ease forwards;
        }

        @keyframes blob {

            0%,
            100% {
                transform: translate(0px, 0px) scale(1);
            }

            33% {
                transform: translate(30px, -50px) scale(1.1);
            }

            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }
        }

        .animate-blob {
            animation: blob 8s infinite;
        }

        .animation-delay-2000 {
            animation-delay: 2s;
        }

        @keyframes pop {
            0% {
                transform: scale(0.7);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .animate-pop {
            animation: pop 0.6s ease forwards;
        }
    </style>

</head>

<body class="bg-gradient-to-r from-green-600 to-green-800 min-h-screen flex items-center justify-center overflow-hidden px-4 relative">

    <!-- Decorative Blobs -->
    <div
        class="absolute top-0 left-0 w-48 h-48 bg-green-400 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob">
    </div>

    <div
        class="absolute bottom-0 right-0 w-72 h-72 bg-green-900 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-2000">
    </div>

    <!-- Thank You Card -->
    <main
        class="relative z-10 bg-white/95 backdrop-blur-lg rounded-3xl shadow-2xl max-w-2xl w-full p-10 sm:p-14 text-center fade-in">

        <!-- Logo -->
        <img src="assets/logo.JPG"
            alt="Girigreen Driving School Logo"
            class="mx-auto w-24 h-24 rounded-full shadow-lg border-4 border-green-100 mb-6">

        <!-- Success Icon -->
        <div class="text-6xl mb-5 animate-pop">
            ✅
        </div>

        <!-- Heading -->
        <h1 class="text-4xl sm:text-5xl font-extrabold text-green-800 mb-5">
            Enrollment Submitted!
        </h1>

        <!-- Message -->
        <p class="text-lg text-gray-700 leading-relaxed max-w-xl mx-auto mb-8">
            Thank you for choosing
            <span class="font-bold text-green-700">
                Girigreen Driving School
            </span>.

            Your enrollment details have been received successfully.
            Our team will contact you shortly with the next steps.
        </p>

        <!-- CTA Button -->
        <a href="index.html"
            class="inline-block bg-gradient-to-r from-green-600 to-green-800 text-white font-bold px-10 py-4 rounded-full shadow-lg hover:scale-105 hover:shadow-2xl transition duration-300">

            Back to Home

        </a>

        <!-- Redirect Text -->
        <p class="mt-6 text-sm text-gray-500">
            Redirecting to homepage in a few seconds...
        </p>

    </main>

</body>

</html>
